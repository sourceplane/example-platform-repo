name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read
  id-token: write   # orun remote-state OIDC authentication

jobs:
  plan:
    name: Orun Plan
    runs-on: ubuntu-latest
    outputs:
      job-ids: ${{ steps.plan.outputs.job-ids }}
      plan-checksum: ${{ steps.plan.outputs.plan-checksum }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sourceplane/orun-action/plan@v1.1.0
        id: plan
        with:
          intent: intent.yaml

  execute:
    name: ${{ matrix.job-id }}
    needs: plan
    if: needs.plan.outputs.job-ids != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        job-id: ${{ fromJson(needs.plan.outputs.job-ids) }}
    concurrency:
      group: orun-${{ github.ref }}-${{ matrix.job-id }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sourceplane/orun-action/run@v1.1.0
        with:
          plan: plan.json
          job: ${{ matrix.job-id }}
          download-artifact: true
          artifact-name: orun-plan
          remote-state: true
          backend-url: ${{ vars.ORUN_BACKEND_URL }}
          exec-id: ${{ github.run_id }}-${{ github.run_attempt }}
          dry-run: ${{ vars.ORUN_DRY_RUN || 'false' }}
