name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read
  id-token: write   # orun remote-state OIDC authentication

jobs:
  # ── PR gate ─────────────────────────────────────────────────────────────────
  validate:
    name: Validate intent
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sourceplane/orun-action/validate@v1
        with:
          intent: intent.yaml

  review-plan:
    name: Review Plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sourceplane/orun-action/plan@v1
        id: plan
        with:
          intent: intent.yaml
          changed-only: true
          base-ref: ${{ github.event.pull_request.base.sha }}
          head-ref: ${{ github.event.pull_request.head.sha }}
          upload-artifact: false
      - name: test
        run: orun plan --changed --base ${{ github.event.pull_request.base.sha }} --head ${{ github.event.pull_request.head.sha }}
      - uses: sourceplane/kiox-action@v2.1.2
        with:
          providers: |
            sourceplane/orun:v1.12.5 as orun
          run: |
            pwd
            orun plan --changed

  # ── Push to main: plan → matrix execute (Pattern 4) ─────────────────────────
  plan:
    name: Compile plan
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      job-ids: ${{ steps.plan.outputs.job-ids }}
      plan-checksum: ${{ steps.plan.outputs.plan-checksum }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sourceplane/orun-action/plan@v1
        id: plan
        with:
          intent: intent.yaml

  execute:
    name: Execute ${{ matrix.job-id }}
    needs: plan
    if: needs.plan.outputs.job-ids != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        job-id: ${{ fromJson(needs.plan.outputs.job-ids) }}
    concurrency:
      group: orun-${{ github.ref }}-${{ matrix.job-id }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sourceplane/orun-action/run@v1
        with:
          plan: plan.json
          job: ${{ matrix.job-id }}
          download-artifact: true
          artifact-name: orun-plan
          remote-state: true
          backend-url: ${{ vars.ORUN_BACKEND_URL }}
          exec-id: ${{ github.run_id }}-${{ github.run_attempt }}
          dry-run: ${{ vars.ORUN_DRY_RUN || 'true' }}
