name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  review-plan:
    name: Review Plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize gluon workspace
        uses: sourceplane/kiox-action@v2.1.2

      - name: Compile review-scoped plan
        run: |
          kiox -- gluon plan

  platform-smoke:
    name: Full Platform Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Initialize gluon workspace
        uses: sourceplane/kiox-action@v2.1.2

      - name: Compile full plan
        run: |
          kiox -- gluon plan --view dag

      - name: Execute full plan
        run: |
          kiox -- gluon run --execute --gha




