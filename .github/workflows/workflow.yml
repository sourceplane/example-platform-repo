name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  review-plan:
    name: Review Plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile review-scoped plan
        uses: sourceplane/tinx-action@813d00a458c74b54cb12ee80eca34deeb89dcc0b
        with:
          version: v0.4.1
          workspace: tinx.yaml
          artifact-name: arx-review-artifacts
          run: |
            set -euo pipefail
            repo_root="$GITHUB_WORKSPACE"
            base_ref="${{ github.event.pull_request.base.ref }}"
            git fetch --no-tags --prune --depth=1 origin "$base_ref"
            changed_files="$(git diff --name-only --diff-filter=ACMR "origin/$base_ref...HEAD" | paste -sd, -)"
            if [[ -z "$changed_files" ]]; then
              changed_files="intent.yaml"
            fi

            printf 'Changed files: %s\n' "$changed_files"
            mkdir -p "$repo_root/.artifacts"
            rm -rf "$repo_root/.arx" "$repo_root/.artifacts/pr-plan.json"

            arx compositions --config-dir "$repo_root/assets/config/compositions"
            arx component \
              --intent "$repo_root/intent.yaml" \
              --config-dir "$repo_root/assets/config/compositions" \
              --files "$changed_files" \
              --long
            arx plan \
              --intent "$repo_root/intent.yaml" \
              --config-dir "$repo_root/assets/config/compositions" \
              --files "$changed_files" \
              --output "$repo_root/.artifacts/pr-plan.json" \
              --view dependencies
            test -s "$repo_root/.artifacts/pr-plan.json"
          artifacts: |
            .artifacts/pr-plan.json
            .arx/component-tree.yaml

  platform-smoke:
    name: Full Platform Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate, plan, and execute with arx
        uses: sourceplane/tinx-action@813d00a458c74b54cb12ee80eca34deeb89dcc0b
        with:
          version: v0.4.1
          workspace: tinx.yaml
          artifact-name: arx-platform-artifacts
          run: |
            set -euo pipefail
            repo_root="$GITHUB_WORKSPACE"
            mkdir -p "$repo_root/.artifacts"
            rm -rf "$repo_root/.arx" "$repo_root/.arx-state.json" "$repo_root/.artifacts/plan.json"

            arx compositions --config-dir "$repo_root/assets/config/compositions"
            arx validate \
              --intent "$repo_root/intent.yaml" \
              --config-dir "$repo_root/assets/config/compositions"
            arx plan \
              --intent "$repo_root/intent.yaml" \
              --config-dir "$repo_root/assets/config/compositions" \
              --output "$repo_root/.artifacts/plan.json" \
              --view dag
            arx run \
              --plan "$repo_root/.artifacts/plan.json" \
              --execute \
              --gha
          artifacts: |
            .artifacts/plan.json
            .arx/component-tree.yaml
            .arx-state.json




