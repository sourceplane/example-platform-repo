name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: read

jobs:
  review-plan:
    name: Review Plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialize orun workspace
        uses: sourceplane/kiox-action@v2.1.2

      - name: Compile changed-aware review plan
        run: |
          kiox -- orun plan --changed --explain \
            --base ${{ github.event.pull_request.base.sha }} \
            --head ${{ github.event.pull_request.head.sha }}

  platform-smoke:
    name: Full Platform Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialize orun workspace
        uses: sourceplane/kiox-action@v2.1.2

      - name: Compile full plan
        run: |
          kiox -- orun plan --view dag

      - name: Execute non-production smoke subset
        env:
          ORUN_SMOKE_ENVS: dev,development,preview,staging
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          kiox -- orun run --env "$ORUN_SMOKE_ENVS" --concurrency 5 || {
            kiox -- orun logs --failed || true
            exit 1
          }
