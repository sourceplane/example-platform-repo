name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  workspace-smoke:
    name: Workspace Smoke
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout torkflow provider source
        uses: actions/checkout@v4
        with:
          repository: sourceplane/torkflow
          path: .providers/src/torkflow
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: .providers/src/torkflow/go.mod

      - name: Install tinx
        uses: sourceplane/tinx-action@813d00a458c74b54cb12ee80eca34deeb89dcc0b

      - name: Build local wtorkflow provider
        run: |
          cd .providers/src/torkflow
          tinx release \
            --manifest provider.yaml \
            --main ./cmd/torkflow \
            --dist dist \
            --output "$GITHUB_WORKSPACE/.providers/torkflow/oci" \
            --tag ci

      - id: workspace-plan
        uses: sourceplane/tinx-action@813d00a458c74b54cb12ee80eca34deeb89dcc0b
        with:
          workspace: tinx.yaml
          run: |
            lite-ci compositions workspace --config-dir assets/config/compositions
            lite-ci validate --intent intent.yaml --config-dir assets/config/compositions
            lite-ci plan \
              --intent intent.yaml \
              --config-dir assets/config/compositions \
              --output plan.json \
              --view dag
          outputs: |
            plan=plan.json
          artifacts: plan.json
      - name: Execute workspace smoke plan
        run: |
          tinx --workspace "$TINX_WORKSPACE_ROOT" -- \
            lite-ci run \
            --execute \
            --plan plan.json




