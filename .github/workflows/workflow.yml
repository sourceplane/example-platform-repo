name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  review-plan:
    name: Review Plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve review scope
        shell: bash
        run: |
          set -euo pipefail
          base_ref="${{ github.event.pull_request.base.ref }}"
          git fetch --no-tags --prune --depth=1 origin "$base_ref"
          changed_files="$(git diff --name-only --diff-filter=ACMR "origin/$base_ref...HEAD" | paste -sd, -)"
          if [[ -z "$changed_files" ]]; then
            changed_files="intent.yaml"
          fi

          printf 'CHANGED_FILES=%s\n' "$changed_files" >> "$GITHUB_ENV"
          mkdir -p .artifacts
          rm -rf .arx .artifacts/pr-plan.json

      - name: Initialize arx workspace
        uses: sourceplane/kiox-action@813d00a458c74b54cb12ee80eca34deeb89dcc0b
        with:
          version: v0.4.1
          workspace: kiox.yaml

      - name: List compositions
        shell: bash
        run: |
          set -euo pipefail
          kiox --workspace "$KIOX_WORKSPACE_ROOT" -- \
            arx compositions --config-dir "$GITHUB_WORKSPACE/assets/config/compositions"

      - name: Review changed components
        shell: bash
        run: |
          set -euo pipefail
          kiox --workspace "$KIOX_WORKSPACE_ROOT" -- \
            arx component \
              --intent "$GITHUB_WORKSPACE/intent.yaml" \
              --config-dir "$GITHUB_WORKSPACE/assets/config/compositions" \
              --files "$CHANGED_FILES" \
              --long

      - name: Compile review-scoped plan
        shell: bash
        run: |
          set -euo pipefail
          kiox --workspace "$KIOX_WORKSPACE_ROOT" -- \
            arx plan \
              --intent "$GITHUB_WORKSPACE/intent.yaml" \
              --config-dir "$GITHUB_WORKSPACE/assets/config/compositions" \
              --files "$CHANGED_FILES" \
              --output "$GITHUB_WORKSPACE/.artifacts/pr-plan.json" \
              --view dependencies

  platform-smoke:
    name: Full Platform Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          rm -rf .arx .arx-state.json .artifacts/plan.json

      - name: Initialize arx workspace
        uses: sourceplane/kiox-action@813d00a458c74b54cb12ee80eca34deeb89dcc0b
        with:
          version: v0.4.1
          workspace: kiox.yaml

      - name: List compositions
        shell: bash
        run: |
          set -euo pipefail
          kiox --workspace "$KIOX_WORKSPACE_ROOT" -- \
            arx compositions --config-dir "$GITHUB_WORKSPACE/assets/config/compositions"

      - name: Validate intent
        shell: bash
        run: |
          set -euo pipefail
          kiox --workspace "$KIOX_WORKSPACE_ROOT" -- \
            arx validate \
              --intent "$GITHUB_WORKSPACE/intent.yaml" \
              --config-dir "$GITHUB_WORKSPACE/assets/config/compositions"

      - name: Compile full plan
        shell: bash
        run: |
          set -euo pipefail
          kiox --workspace "$KIOX_WORKSPACE_ROOT" -- \
            arx plan \
              --intent "$GITHUB_WORKSPACE/intent.yaml" \
              --config-dir "$GITHUB_WORKSPACE/assets/config/compositions" \
              --output "$GITHUB_WORKSPACE/.artifacts/plan.json" \
              --view dag

      - name: Execute full plan
        shell: bash
        run: |
          set -euo pipefail
          kiox --workspace "$KIOX_WORKSPACE_ROOT" -- \
            arx run \
              --plan "$GITHUB_WORKSPACE/.artifacts/plan.json" \
              --execute \
              --gha




