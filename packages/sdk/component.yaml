apiVersion: sourceplane.io/v1
kind: Component

metadata:
  name: platform-sdk

spec:
  type: turbo-package
  domain: platform-packages
  subscribe:
    environments:
      - development
      - staging
      - production
  inputs:
    workspaceDir: ../..
    packageDir: packages/sdk
    installCommand: pnpm install --no-frozen-lockfile
    buildCommand: pnpm turbo run build --filter=@example/sdk
    typecheckCommand: pnpm turbo run typecheck --filter=@example/sdk
    nodeVersion: "20"
    pnpmVersion: "10.12.1"
  labels:
    team: platform
    layer: shared
    surface: sdk
    runtime: node