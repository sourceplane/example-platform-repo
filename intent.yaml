apiVersion: sourceplane.io/v1
kind: Intent

metadata:
  name: workspace-provider-smoke
  description: Provider-native DevOps smoke flow compiled by lite-ci and executed through tinx
  namespace: default

environments:
  development:
    selectors:
      components:
        - workspace-provider-smoke
    defaults:
      lane: dry-run
      namespacePrefix: smoke-
    policies:
      requireApproval: "false"

components:
  - name: workspace-provider-smoke
    type: workspace
    path: .
    enabled: true
    inputs:
      AZURE_CLI_VERSION: 2.85.0
      chartPath: services/hello-app
      valuesFile: services/hello-app/values.yaml
      kustomizeDir: assets/fixtures/kustomize
      terraformDir: assets/fixtures/terraform
      workflowFile: assets/workflows/provider-smoke.yaml
    labels:
      team: platform
      philosophy: devops-as-a-provider
    dependsOn: []
