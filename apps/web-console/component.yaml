apiVersion: sourceplane.io/v1
kind: Component

metadata:
  name: web-console-pages

spec:
  type: cloudflare-pages-turbo
  domain: platform-ui
  subscribe:
    environments:
      - production
  inputs:
    workspaceDir: ../..
    appDir: apps/web-console
    installCommand: pnpm install --no-frozen-lockfile
    buildCommand: pnpm turbo run build --filter=@example/web-console
    outputDir: apps/web-console/dist
    projectName: example-platform-web-console
    nodeVersion: "20"
    pnpmVersion: "10.12.1"
    productionBranch: main
  labels:
    team: platform
    layer: delivery
    surface: web-console
    runtime: cloudflare