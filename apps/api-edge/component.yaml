apiVersion: sourceplane.io/v1
kind: Component

metadata:
  name: api-edge-worker

spec:
  type: cloudflare-worker-turbo
  domain: platform-runtime
  subscribe:
    environments:
      - production
  inputs:
    workspaceDir: ../..
    appDir: apps/api-edge
    installCommand: pnpm install --no-frozen-lockfile
    buildCommand: pnpm turbo run build --filter=@example/api-edge
    typecheckCommand: pnpm turbo run typecheck --filter=@example/api-edge
    deployCommand: pnpm --filter @example/api-edge deploy
    nodeVersion: "20"
    pnpmVersion: "10.12.1"
    productionBranch: main
  labels:
    team: platform
    layer: runtime
    surface: api
    runtime: cloudflare