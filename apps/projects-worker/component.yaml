apiVersion: sourceplane.io/v1
kind: Component

metadata:
  name: projects-worker

spec:
  type: cloudflare-worker-turbo
  domain: platform-projects
  subscribe:
    environments:
      - production
  inputs:
    workspaceDir: ../..
    appDir: apps/projects-worker
    installCommand: pnpm install --no-frozen-lockfile
    buildCommand: pnpm turbo run build --filter=@example/projects-worker
    typecheckCommand: pnpm turbo run typecheck --filter=@example/projects-worker
    deployCommand: pnpm --filter @example/projects-worker deploy
    nodeVersion: "20"
    pnpmVersion: "10.12.1"
    productionBranch: main
  labels:
    team: platform
    layer: runtime
    surface: projects
    runtime: cloudflare