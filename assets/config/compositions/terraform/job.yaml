apiVersion: sourceplane.io/v1
kind: JobRegistry
metadata:
  name: terraform-jobs
  description: Terraform validation jobs for infra components
jobs:
  - name: validate-terraform
    description: Validate Terraform stacks with fmt, init, and validate
    runsOn: ubuntu-22.04
    timeout: 20m
    retries: 0
    labels:
      scope: infra
    steps:
      - name: terraform-context
        run: echo "Validating {{.stackName}} at {{.terraformDir}}"
        onFailure: stop
      - name: terraform-fmt-check
        run: terraform fmt -check {{.terraformDir}}
        onFailure: stop
      - name: terraform-init
        run: terraform -chdir={{.terraformDir}} init -backend=false -input=false
        onFailure: stop
      - name: terraform-validate
        run: terraform -chdir={{.terraformDir}} validate -no-color
        onFailure: stop